[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aqi-pipeline"
version = "0.1.0"
description = "Automated AQI forecasting with model monitoring and intelligent retraining"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "httpx>=0.27", "fastapi>=0.110"]

[project.scripts]
aqi-pipeline = "aqi_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aqi_pipeline = ["report_template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
