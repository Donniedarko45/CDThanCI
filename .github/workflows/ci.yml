name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-package:
    name: Lint, JS check & package build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev]"

      - name: Run Ruff lint and format checks
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Check static JavaScript syntax
        run: |
          for f in src/aqi_pipeline/static/*.js; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify wheel includes templates and static assets
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, f"Expected 1 wheel, got {wheels}"
          with zipfile.ZipFile(wheels[0]) as zf:
              names = set(zf.namelist())
          required = {
              "aqi_pipeline/report_template.html",
              "aqi_pipeline/static/index.html",
              "aqi_pipeline/static/app.js",
              "aqi_pipeline/static/charts.js",
              "aqi_pipeline/static/styles.css",
          }
          missing = sorted(required - names)
          assert not missing, f"Missing files in wheel: {missing}"
          print("Verified wheel package data:", sorted(required))
          PY

      - name: Upload built distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/

  test-matrix:
    name: Pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package with API and dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev]"

      - name: Run test suite with coverage
        run: |
          pytest -q \
            --cov=aqi_pipeline \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml="junit-${{ matrix.python-version }}.xml"

      - name: Write test and coverage summary
        if: always()
        env:
          PY_VER: ${{ matrix.python-version }}
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          py_ver = os.environ["PY_VER"]
          junit_path = f"junit-{py_ver}.xml"
          cov_path = "coverage.xml"
          lines = [f"### Python {py_ver} Test & Coverage Summary", ""]

          if os.path.exists(junit_path):
              root = ET.parse(junit_path).getroot()
              suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
              tests = sum(int(s.attrib.get("tests", 0)) for s in suites)
              failures = sum(int(s.attrib.get("failures", 0)) for s in suites)
              errors = sum(int(s.attrib.get("errors", 0)) for s in suites)
              skipped = sum(int(s.attrib.get("skipped", 0)) for s in suites)
              elapsed = sum(float(s.attrib.get("time", 0.0)) for s in suites)
              passed = tests - failures - errors - skipped
              lines.append(
                  f"- **Tests**: {tests} total, {passed} passed, "
                  f"{failures} failed, {errors} errors, {skipped} skipped ({elapsed:.1f}s)"
              )

          if os.path.exists(cov_path):
              cov_root = ET.parse(cov_path).getroot()
              rate = float(cov_root.attrib.get("line-rate", 0.0)) * 100.0
              lines.append(f"- **Line coverage**: {rate:.1f}%")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          PY

      - name: Upload coverage and JUnit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            coverage.xml
            junit-${{ matrix.python-version }}.xml

  e2e-and-ui:
    name: E2E simulation, API & Playwright UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package, test deps and Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev,e2e]"
          playwright install chromium --with-deps

      - name: Run 15-day simulation, status and report
        run: |
          aqi-pipeline --run-dir /tmp/ci-demo simulate --days 15 --quiet
          aqi-pipeline --run-dir /tmp/ci-demo status
          aqi-pipeline --run-dir /tmp/ci-demo report

      - name: Verify live API endpoints and Playwright UI
        run: |
          mkdir -p /tmp/ci-ui-artifacts
          aqi-pipeline --run-dir /tmp/ci-demo serve --host 127.0.0.1 --port 8000 > /tmp/ci-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          python - <<'PY'
          import json
          import time
          import urllib.request

          base = "http://127.0.0.1:8000"
          for _ in range(40):
              try:
                  with urllib.request.urlopen(f"{base}/health", timeout=2) as resp:
                      if resp.status == 200:
                          break
              except Exception:
                  time.sleep(0.5)
          else:
              raise RuntimeError("API server did not become healthy in time")

          for path in ["/", "/static/app.js", "/report", "/health", "/dashboard/data", "/api/config", "/api/analytics"]:
              with urllib.request.urlopen(f"{base}{path}", timeout=10) as resp:
                  assert resp.status == 200, f"GET {path} returned {resp.status}"
                  body = resp.read()
                  assert len(body) > 0, f"GET {path} returned empty body"
              print(f"GET {path} -> 200")

          with urllib.request.urlopen(f"{base}/observations/recent?hours=48", timeout=10) as resp:
              obs = json.loads(resp.read().decode("utf-8"))["observations"]
          assert len(obs) >= 24, f"Expected >=24 observations, got {len(obs)}"

          for endpoint in ["/predict", "/predict/batch"]:
              req = urllib.request.Request(
                  f"{base}{endpoint}",
                  data=json.dumps({"observations": obs}).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=15) as resp:
                  assert resp.status == 200, f"POST {endpoint} returned {resp.status}"
                  payload = json.loads(resp.read().decode("utf-8"))
                  print(f"POST {endpoint} -> 200 (keys={sorted(payload.keys())})")
          PY

          python - <<'PY'
          from playwright.sync_api import sync_playwright

          base = "http://127.0.0.1:8000"
          console_errors = []
          page_errors = []
          http_errors = []

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width": 1440, "height": 900})
              page.on("console", lambda msg: console_errors.append(msg.text) if msg.type == "error" else None)
              page.on("pageerror", lambda err: page_errors.append(str(err)))
              page.on("response", lambda res: http_errors.append(f"{res.status} {res.url}") if res.status >= 400 else None)

              page.goto(base, wait_until="networkidle")
              page.wait_for_timeout(600)

              # Switch across all 5 views via nav links and assert each section is visible
              for route in ["overview", "diagnostics", "simulator", "registry", "pipeline", "overview"]:
                  page.locator(f'a[href="#/{route}"]').click()
                  page.wait_for_timeout(300)
                  assert page.locator(f"#view-{route}").is_visible(), f"#view-{route} not visible"

              # Horizon selector check
              for horizon in ["24", "48", "168", "72"]:
                  btn = page.locator(f'#horizonSelector button[data-hours="{horizon}"]')
                  btn.click()
                  page.wait_for_timeout(300)
                  assert "active" in (btn.get_attribute("class") or ""), f"Horizon {horizon}h did not become active"

              # Theme toggle check
              theme_btn = page.locator("#themeToggleBtn")
              assert theme_btn.count() == 1, "Theme toggle button #themeToggleBtn not found"
              before_theme = page.evaluate("document.documentElement.getAttribute('data-theme') || ''")
              theme_btn.click()
              page.wait_for_timeout(200)
              after_theme = page.evaluate("document.documentElement.getAttribute('data-theme') || ''")
              assert before_theme != after_theme, f"Theme did not toggle ({before_theme!r} -> {after_theme!r})"
              theme_btn.click()
              page.wait_for_timeout(200)

              page.screenshot(path="/tmp/ci-ui-artifacts/dashboard.png", full_page=True)
              browser.close()

          assert not console_errors, f"Console errors: {console_errors}"
          assert not page_errors, f"Page errors: {page_errors}"
          assert not http_errors, f"HTTP errors: {http_errors}"
          print("Playwright UI checks passed with 0 errors")
          PY

      - name: Upload UI screenshot and monitoring report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-ui-artifacts
          path: |
            /tmp/ci-ui-artifacts/dashboard.png
            /tmp/ci-demo/reports/monitoring_report.html

  docker-smoke:
    name: Docker image & Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose configuration
        run: docker compose config -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: aqi-pipeline:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify container runs as non-root user
        run: |
          uid="$(docker run --rm --entrypoint id aqi-pipeline:ci-test -u)"
          echo "Container UID: $uid"
          test "$uid" != "0"

      - name: Seed simulated data and verify container health & endpoints
        run: |
          docker volume create aqi_ci_smoke
          docker run --rm -v aqi_ci_smoke:/data aqi-pipeline:ci-test \
            aqi-pipeline --run-dir /data simulate --days 15 --quiet
          docker run -d --name aqi-smoke -p 8000:8000 -v aqi_ci_smoke:/data aqi-pipeline:ci-test

          for i in $(seq 1 30); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' aqi-smoke)"
            echo "Attempt $i health status: $status"
            if [ "$status" = "healthy" ]; then
              break
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs aqi-smoke
              exit 1
            fi
            sleep 2
          done

          test "$(docker inspect --format '{{.State.Health.Status}}' aqi-smoke)" = "healthy"
          curl -fsS http://127.0.0.1:8000/health | python -c "import json,sys; d=json.load(sys.stdin); assert d['status']=='ok' and d['champion']"
          curl -fsS http://127.0.0.1:8000/ | grep -q "AQI"
          curl -fsS http://127.0.0.1:8000/api/config | python -c "import json,sys; d=json.load(sys.stdin); assert d['bootstrapped'] is True"
          curl -fsS http://127.0.0.1:8000/dashboard/data | python -c "import json,sys; d=json.load(sys.stdin); assert d['status']['bootstrapped'] is True"

      - name: Clean up smoke container and volume
        if: always()
        run: |
          docker rm -f aqi-smoke >/dev/null 2>&1 || true
          docker volume rm -f aqi_ci_smoke >/dev/null 2>&1 || true
